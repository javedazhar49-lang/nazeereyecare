:`24/7 Helpline & On-Call Emergency Care`},stats:[{label:`Cornea Care Heritage`,value:`30+`,unit:`Years`},{label:`Patients Checkup`,value:`1M+`,unit:`Patients`},{label:`Surgeries`,value:`31k`,unit:`Procedures`},{label:`Phaco Cataract Surgeries`,value:`25k+`,unit:`Procedures`},{label:`Surgical Success Rate`,value:`99.7%`,unit:`Precision`},{label:`Specialist Faculty`,value:`13+`,unit:`Doctors`}]},Ze=[{id:`glasses-removal`,title:`Glasses Removal (Femto LASIK, SMILE & PRK)`,urduTitle:`عینک سے نجات (Glasses Removal)`,category:`refractive`,categoryLabel:`Laser Vision Correction`,shortDesc:`blade free femto implantable collamer lens.`,fullDesc:`Under the leadership of Prof. Dr. Shahid Nazeer and our refractive surgeons, Nazeer Eye Care provides world-standard blade-free laser vision correction. Combining German Schwind Amaris 750Hz excimer technology with Femtosecond corneal flap creation, our laser precisely re-sculpts the cornea in seconds to treat Myopia, Hyperopia, and Astigmatism with 7D eye-tracking safety.`,technology:`Schwind Amaris 750 Hz Excimer & Ziemer Femtosecond LDV`,procedureTime:`10 - 15 minutes for both eyes`,recoveryTime:`Crystal-clear vision within 24 hours`,anesthesia:`Topical anesthetic eye drops (no injections, no pain)`,candidateProfile:`Ages 18+, stable prescription for 1 year, suitable corneal thickness determined by Pentacam scan.`,highlights:[`100% blade-free, painless outpatient procedure`,`7D active eye-tracking tracking micro-saccadic eye movements`,`Wavefront-guided customized ablation for crisp night driving`,`Over 99.8% of patients achieve 20/20 or better uncorrected vision`],clinicalSteps:[`Comprehensive Pentacam HR corneal tomography & wavefront mapping`,`Blade-free laser corneal flap creation in under 15 seconds`,`High-speed 750Hz laser reshaping of the corneal curvature`,`Gentle natural flap repositioning with instant adhesion`,`Next-day visual acuity assessment and recovery check`],imageUrl:`https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=1000&q=80`},{id:`corneal-transplant`,title:`Corneal Transplant & endothelial keratoplasty / bostan keratoplasty ( artificial cornea )`,urduTitle:`قرنیہ کی پیوند کاری اور مصنوعی قرنیہ (Corneal Transplant & Boston Keratoprosthesis)`,category:`cornea`,categoryLabel:`Cornea & Transplants`,shortDesc:`Punjab's pioneering center performing corneal transplant, sutureless endothelial keratoplasty (DSAEK/DMEK), and Boston keratoprosthesis (artificial cornea).`,fullDesc:`Nazeer Eye Care at Lions Medical Complex is the historic pioneer of sight-restoring corneal transplantation in Lahore since 1995. With regular, certified donor tissue partnerships from the International Eye Bank (Dr. Hudson Silva), our team performs full-thickness and advanced sutureless endothelial keratoplasty, as well as Boston Keratoprosthesis (artificial cornea) for complex, high-risk or repeat graft failure cases to restore light to diseased or opaque eyes.`,technology:`Zeiss OPMI Lumera 700 Microscope, Endothelial Trephine Micro-Instrumentation & Boston KPro System`,procedureTime:`45 - 60 minutes`,recoveryTime:`Progressive visual rehabilitation with dedicated corneal specialist care`,anesthesia:`Local or general anesthesia`,candidateProfile:`Patients with corneal opacity, bullous keratopathy, endothelial dysfunction, corneal scars, severe ocular trauma, or multiple failed standard grafts.`,highlights:[`30+ years institutional heritage in certified corneal transplantation`,`Specialized Endothelial Keratoplasty (DSAEK / DMEK) with rapid recovery`,`Boston Keratoprosthesis (Artificial Cornea) expertise for high-risk graft rejection cases`,`Regular tissue supply from accredited international eye banks`,`Long-term post-operative graft surveillance and anti-rejection care`],clinicalSteps:[`Microscopic endothelial cell count (Specular microscopy) & pachymetry`,`Procurement and quality screening of certified donor corneal button`,`Precision microsurgical trephination and excision of scarred cornea`,`Micro-suture alignment using 10-0 nylon or air-bubble endothelial fixation`,`Comprehensive post-operative anti-inflammatory and graft survival protocol`],imageUrl:`https://images.unsplash.com/photo-1516549655169-df83a0774514?auto=format&fit=crop&w=1000&q=80`},{id:`cataract`,title:`Cataract (Micro-Incision Phaco & Premium IOLs)`,urduTitle:`سفید موتیا کا علاج (Cataract Surgery)`,category:`cataract`,categoryLabel:`Cataract & Lens`,shortDesc:`Stitchless 2.2mm micro-phacoemulsification with world-class foldable Trifocal, Toric, and Extended Depth of Focus (EDOF) intraocular lenses.`,fullDesc:`Reclaim youthful clarity with sutureless Micro-Incision Cataract Surgery (MICS). Using gentle ultrasonic energy and fluidics, the clouded natural crystalline lens is emulsified and replaced with premium foldable artificial intraocular lenses (Zeiss AT LISA Tri, Alcon AcrySof IQ Toric), providing simultaneous freedom from reading and distance glasses.`,technology:`Alcon Centurion Vision System & IOLMaster 700 Biometry`,procedureTime:`10 - 15 minutes per eye`,recoveryTime:`Immediate visual brightening, stable within 3-5 days`,anesthesia:`Topical drop anesthesia (stitchless, injection-free)`,candidateProfile:`Individuals with hazy, blurred, yellowed, or glare-sensitive sight caused by lens cataract opacification.`,highlights:[`100% stitchless, injection-free, needle-free day-care surgery`,`Premium Trifocal & Multifocal lenses correcting reading and distance`,`Toric IOLs eliminating pre-existing corneal astigmatism`,`Safe and proven for diabetic, cardiac, and elderly patients`],clinicalSteps:[`Swept-source IOLMaster 700 optical biometry for exact lens power`,`Sub-2.2mm self-sealing corneal micro-incision`,`Capsulorhexis and ultrasonic phacoemulsification of clouded cataract`,`Injection of foldable premium intraocular lens inside the capsular bag`,`Hydration of incision with zero sutures required and same-day discharge`],imageUrl:`https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?auto=format&fit=crop&w=1000&q=80`},{id:`glaucoma`,title:`Glaucoma Early Detection & Micro-Surgery`,urduTitle:`کالا موتیا کا علاج (Glaucoma)`,category:`glaucoma`,categoryLabel:`Glaucoma Specialty`,shortDesc:`Preserving optic nerve health through computerized visual field perimetry, Selective Laser Trabeculoplasty (SLT), and augmented trabeculectomy.`,fullDesc:`Often termed the 'silent thief of sight', glaucoma damages the optic nerve without early pain. Our glaucoma clinic provides computerized Humphrey visual field perimetry, OCT retinal nerve fiber layer (RNFL) mapping, cold SLT laser to lower intraocular pressure, and augmented trabeculectomy with antimetabolites or Ahmed glaucoma valve shunts.`,technology:`Lumenis Selecta II SLT Laser & Humphrey Visual Field HFA3`,procedureTime:`10 minutes (SLT laser) to 40 minutes (filtering surgery)`,recoveryTime:`Immediate for laser; 1-2 weeks for filtering surgery`,anesthesia:`Topical eye drops (laser) or monitored local anesthesia (surgery)`,candidateProfile:`Patients with elevated eye pressure (IOP), positive family history of glaucoma, or optic disc cupping.`,highlights:[`Cold-laser SLT reducing dependence on expensive daily eye drops`,`Computerized Humphrey automated visual field analysis`,`Mitomycin-C augmented trabeculectomy for resistant cases`,`Lifelong progression monitoring preventing irreversible blindness`],clinicalSteps:[`Goldmann applanation tonometry and corneal pachymetry`,`Humphrey 24-2 / 30-2 computerized visual field testing`,`High-definition OCT analysis of the retinal nerve fiber layer (RNFL)`,`Targeted SLT laser trabeculoplasty or micro-surgical filtration`,`Customized pressure-lowering maintenance program`],imageUrl:`https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1000&q=80`},{id:`retina`,title:`Retina & Vitreous Micro-Surgery`,urduTitle:`پردہ بصارت کا علاج (Retina & Vitreous)`,category:`retina`,categoryLabel:`Retina & Vitreous`,shortDesc:`Advanced 25G/27G sutureless vitrectomy for complex vitreoretinal disorders, macular holes, epiretinal membranes, and vitreous hemorrhages.`,fullDesc:`Headed by senior vitreoretinal surgeons, our posterior segment theater is outfitted with the Alcon Constellation 10,000 cuts/min vitrectomy system and non-contact Zeiss Resight viewing. We manage complex macular holes, vitreous hemorrhage, epiretinal membranes, and foreign body extractions with microscopic precision.`,technology:`Alcon Constellation 10,000 cpm & Zeiss Resight 700`,procedureTime:`45 - 75 minutes`,recoveryTime:`1 to 3 weeks with specific posturing if gas bubble used`,anesthesia:`Monitored local or general anesthesia`,candidateProfile:`Individuals experiencing sudden visual distortion, dark curtains, wavy lines, floaters, or bleeding in the eye.`,highlights:[`Micro-cannular 25G / 27G stitchless vitrectomy system`,`Endo-laser photocoagulation and internal limiting membrane (ILM) peeling`,`Wide-angle non-contact stereoscopic visualization`,`High rate of macular hole closure and visual rehabilitation`],clinicalSteps:[`Spectral-Domain OCT diagnostic scanning of retinal layers`,`Insertion of microscopic 25G transconjunctival trocars`,`Aspiration and clearance of vitreous gel and tractional bands`,`Micro-forceps membrane peeling and endolaser application`,`Internal gas (C3F8/SF6) or medical silicone oil tamponade`],imageUrl:`https://images.unsplash.com/photo-1551601651-2a8555f1a136?auto=format&fit=crop&w=1000&q=80`},{id:`retinal-detachment`,title:`Retinal Detachment Emergency Surgery`,urduTitle:`پردہ بصارت کا ادھڑنا (Retinal Detachment)`,category:`retina`,categoryLabel:`Emergency Vitreoretinal`,shortDesc:`Emergency sight-saving reattachment surgery utilizing 25G pars plana vitrectomy, scleral buckle, pneumatic retinopexy, and endotamponade.`,fullDesc:`Retinal detachment is an acute ocular emergency where the neurosensory retina peels away from underlying choroidal blood supply. Led by Prof. Dr. Shahid Nazeer, our emergency surgical theater offers urgent reattachment using 25G vitrectomy, scleral buckling, cryopexy, endolaser barrier photocoagulation, and gas/silicone oil tamponade to prevent irreversible sight loss.`,technology:`Constellation Vitrectomy Suite, Cryopexy & Purepoint Green Endo-Laser`,procedureTime:`60 - 90 minutes`,recoveryTime:`Gradual stabilization over 2 to 6 weeks with head positioning`,anesthesia:`Monitored peribulbar block or general anesthesia`,candidateProfile:`Patients presenting with sudden flashes of light, showers of black spots, or a dark shadow covering peripheral/central vision.`,highlights:[`Urgent same-day emergency surgical intake protocol`,`25G sutureless vitrectomy eliminating surgical trauma`,`High primary anatomical reattachment success rate`,`Long-term retinal barrier laser to prevent contralateral tears`],clinicalSteps:[`Urgent dilated 360-degree fundus examination and B-scan ultrasonography`,`Creation of micro-trocar entry ports and complete vitreous shaving`,`Fluid-air exchange with internal drainage of subretinal fluid`,`Endolaser or transscleral cryopexy around all retinal tears`,`Silicone oil or long-acting gas injection to seal the retina in place`],imageUrl:Ke},{id:`diabetic-retinopathy`,title:`Diabetic Retinopathy & Anti-VEGF Therapy`,urduTitle:`شوگر کے اثرات برائے بینائی (Diabetic Retinopathy)`,category:`retina`,categoryLabel:`Diabetic Eye Care`,shortDesc:`Targeted Anti-VEGF injections (Eylea, Lucentis, Avastin) and Argon green laser photocoagulation to halt diabetic vascular leakage.`,fullDesc:`Diabetes causes fragile, leaky micro-vessels in the retina leading to diabetic macular edema (DME) and proliferative retinopathy. Our comprehensive diabetic eye service utilizes Swept-Source OCT and fundus fluorescein angiography (FFA) to guide precise Anti-VEGF pharmacological injections and pan-retinal photocoagulation (PRP) laser, safeguarding vision.`,technology:`Argon Purepoint Green Laser & Cirrus HD-OCT`,procedureTime:`10 - 20 minutes`,recoveryTime:`Same-day discharge with normal routine resume next morning`,anesthesia:`Topical anesthetic eye drops`,candidateProfile:`Diabetic patients with blurry vision, fluctuating clarity, microaneurysms, or retinal hemorrhages.`,highlights:[`Intravitreal Anti-VEGF injections reducing macular swelling rapidly`,`Pattern scan green laser minimizing discomfort during PRP`,`Comprehensive systemic diabetic counseling and glucose coordination`,`Routine annual screening preventing sudden diabetic vitreous hemorrhage`],clinicalSteps:[`Non-mydriatic high-resolution fundus photography & OCT central thickness`,`Sterile ophthalmic prep and topical drop anesthesia`,`Painless micro-needle intravitreal injection of Anti-VEGF medication`,`Pattern laser photocoagulation for proliferative neovascular vessels`,`Monthly OCT tracking until macular swelling is completely resolved`],imageUrl:`https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?auto=format&fit=crop&w=1000&q=80`},{id:`keratoconus`,title:`Keratoconus Customized Treatment CXL to CAIRS`,urduTitle:`کیراٹوکونس کا علاج (Customized CXL to CAIRS)`,category:`cornea`,categoryLabel:`Corneal Ectasia`,shortDesc:`Halting progressive corneal thinning and reshaping corneal architecture using customized treatment protocols from CXL to CAIRS.`,fullDesc:`Keratoconus is a progressive condition where the cornea thins and bulges into an irregular cone shape. Our specialized cornea unit utilizes customized protocols ranging from Accelerated Riboflavin Corneal Cross-Linking (CXL) to CAIRS (Corneal Allogenic Intrastromal Ring Segments) and topo-guided treatments to stabilize biomechanical integrity, flatten the cone, and restore functional visual acuity.`,technology:`Avedro KXL UV Cross-Linking System, Femtosecond Laser CAIRS & Oculus Pentacam HR`,procedureTime:`30 - 45 minutes`,recoveryTime:`Rapid healing with long-term corneal stabilization and flattening`,anesthesia:`Topical anesthetic drops`,candidateProfile:`Patients with early to advanced keratoconus, worsening irregular astigmatism, or progressive corneal ectasia.`,highlights:[`Customized patient-tailored protocol from CXL to CAIRS`,`CAIRS: Biocompatible allogenic intrastromal tissue segments for natural corneal flattening`,`Accelerated Riboflavin-UVA photopolymerization halting thinning progression`,`Prevents invasive full-thickness penetrating keratoplasty`,`Specialty contact lens fitting clinic (Rose K & Scleral lenses)`],clinicalSteps:[`Pentacam Belin-Ambrósio enhanced ectasia progression analysis`,`Soaking the corneal stroma with pharmaceutical Riboflavin (Vitamin B2)`,`Controlled UVA light irradiation to induce collagen cross-links`,`Placement of a protective therapeutic bandage contact lens (BCL)`,`Follow-up topography confirming stabilization of corneal curvature`],imageUrl:Ge},{id:`icl-lenses`,title:`ICL (Implantable Collamer Lenses)`,urduTitle:`آئی سی ایل لینز (Implantable Collamer Lenses)`,category:`refractive`,categoryLabel:`Phakic Lens Implants`,shortDesc:`Reversible, HD visual correction for extreme myopia, thin corneas, or dry eye patients who are unsuitable for laser LASIK.`,fullDesc:`Implantable Collamer Lenses (EVO Visian ICL) represent the pinnacle of high-definition vision correction for patients who cannot undergo LASIK due to thin corneas, high refractive errors (up to -20D), or severe dry eye. The biocompatible Collamer lens is gently placed behind the iris and in front of the natural lens, preserving corneal architecture completely and remaining 100% removable.`,technology:`STAAR Surgical EVO+ Visian ICL & UBM Anterior Chamber Biometry`,procedureTime:`15 minutes per eye`,recoveryTime:`Instant visual HD upgrade within 12 - 24 hours`,anesthesia:`Topical anesthetic eye drops (painless and stitch-free)`,candidateProfile:`Ages 21-45 with moderate to high myopia (-3.00D to -20.00D) or astigmatism, with thin corneas or dry eyes.`,highlights:[`Zero removal of natural corneal tissue; 100% reversible`,`Superb high-definition night vision with zero dry eye induction`,`Built-in ultraviolet (UV) protection filter`,`Approved for individuals declared ineligible for LASIK`],clinicalSteps:[`Ultra-sound biomicroscopy (UBM) measuring anterior chamber depth & sulcus size`,`Custom ordering of personalized Swiss/US manufactured Collamer lens`,`Microscopic 2.8mm entry under topical drop anesthesia`,`Injection and unfolding of ICL into the posterior chamber behind the iris`,`Rapid visual clarity check with immediate post-op release`],imageUrl:qe},{id:`dcr-surgery`,title:`DCR (Dacryocystorhinostomy) - Tear Duct Surgery`,urduTitle:`آنکھ کی نالی کا آپریشن (DCR Surgery)`,category:`oculoplastic`,categoryLabel:`Lacrimal & Tear Duct`,shortDesc:`Endoscopic and micro-surgical tear duct bypass creating a new drainage channel to cure persistent watering eyes (epiphora) and infection.`,fullDesc:`Chronic watering, discharge, and painful swelling at the inner corner of the eye are classic signs of nasolacrimal duct obstruction and dacryocystitis. Our oculoplastic surgeons perform both Endoscopic (scarless through the nose) and External DCR surgeries with silicone stent intubation, permanently restoring natural tear drainage without facial scarring.`,technology:`Karl Storz HD Endoscopic Tower & Micro-Lacrimal Drills`,procedureTime:`35 - 50 minutes`,recoveryTime:`5 - 7 days; immediate relief from chronic overflow tearing`,anesthesia:`Local anesthesia with light sedation or general anesthesia`,candidateProfile:`Patients suffering constant tearing (epiphora), recurrent sticky discharge, or painful inner-corner eye swelling.`,highlights:[`Scarless endonasal endoscopic approach option available`,`Permanent cure for chronic watery eyes and dacryocystitis`,`Silicone Crawford intubation stent for flawless channel patency`,`Day-care surgery with minimal post-operative downtime`],clinicalSteps:[`Diagnostic lacrimal syringing and probing to locate obstruction`,`Creation of an ostium bypass between lacrimal sac and nasal cavity`,`Placement of a soft silicone stent to maintain the new drainage passage`,`Careful mucosal flap suturing with micro-hemostasis`,`Painless outpatient stent removal at 6-8 weeks follow-up`],imageUrl:`https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1000&q=80`},{id:`squint-surgery`,title:`Squint Surgery & Strabismus Realignment`,urduTitle:`بھینگا پن کا علاج (Squint & Strabismus)`,category:`pediatric`,categoryLabel:`Pediatric & Strabismus`,shortDesc:`Precision micro-surgical extraocular muscle realignment for children and adults to restore straight eye alignment and binocular 3D vision.`,fullDesc:`Squint (strabismus or crossed eyes) can affect both infants and adults, leading to lazy eye (amblyopia), loss of 3D depth perception, and cosmetic distress. Our strabismus surgical faculty performs delicate muscle recession and resection using adjustable sutures, restoring perfect cosmetic symmetry and binocular single vision in a gentle clinical setting.`,technology:`PlusoptiX Digital Vision Screener & Micro-Muscular Sets`,procedureTime:`30 - 60 minutes`,recoveryTime:`Resumption of normal activities in 48 to 72 hours`,anesthesia:`Pediatric general anesthesia or local anesthesia in cooperative adults`,candidateProfile:`Children or adults with inward (esotropia) or outward (exotropia) eye turning, double vision, or abnormal head posture.`,highlights:[`Restores normal binocular stereoscopic depth perception`,`Adjustable suture techniques for millimeter-level ocular alignment`,`Comprehensive amblyopia patching and visual therapy integration`,`Safe, caring theater environment with dedicated pediatric anesthesiologists`],clinicalSteps:[`Prism cover testing and cycloplegic refraction measurement`,`Micro-conjunctival incision under gentle anesthesia`,`Precise identification and measurement of target extraocular muscles`,`Millimeter recession (loosening) or resection (tightening) of muscles`,`Rapid post-operative visual recovery and
